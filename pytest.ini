[pytest]
testpaths = tests
addopts = -m "not integration and not model" --strict-markers -p no:cacheprovider
markers =
    integration: talks to a real NVR/camera; run explicitly with -m integration and ALPHA_VISION_LIVE_RTSP=1
    model: loads the real YOLO weights (slow); run explicitly with -m model
filterwarnings =
    ignore::DeprecationWarning
